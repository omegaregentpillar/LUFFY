name: update-readme-todo

on:
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          path: dev-repo
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update README TODO list from dev .py sources
        run: python main-repo/.github/scripts/update_readme.py dev-repo
      - name: Commit and push README to dev
        working-directory: dev-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No README changes to commit"
            exit 0
          fi
          git commit -m "docs: update Complete TODO List for implemented dev TODOs"
          git push origin HEAD:dev
